name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk calculator.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: calculator.apk

      - name: Publish APK to the "latest" release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: أحدث نسخة
          files: calculator.apk
          make_latest: true
