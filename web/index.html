<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>حاسبة بسيطة</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#1e293b;font-family:system-ui,sans-serif;color:#fff}
  .app{max-width:420px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:16px}
  .screen{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;direction:ltr;padding:12px 8px;word-break:break-all}
  .expr{font-size:22px;color:#94a3b8;min-height:30px}
  .res{font-size:56px;font-weight:600}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}
  button{height:68px;border:0;border-radius:18px;font-size:26px;background:#334155;color:#fff;cursor:pointer}
  button:active{filter:brightness(1.3)}
  .op{background:#f59e0b}.fn{background:#475569}.eq{background:#22c55e}
</style>
</head>
<body>
<div class="app">
  <div class="screen"><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
  <div class="keys" id="keys"></div>
</div>
<script>
const layout=[['C','fn'],['⌫','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0'],['.'],['00'],['=','eq']];
const keys=document.getElementById('keys'),exprEl=document.getElementById('expr'),resEl=document.getElementById('res');
let expr='';
layout.forEach(([k,c])=>{const b=document.createElement('button');b.textContent=k;if(c)b.className=c;b.onclick=()=>press(k);keys.appendChild(b)});
function calc(s){
  const t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
  if(!/^[0-9+\-*/.() ]+$/.test(t))return null;
  try{const v=Function('"use strict";return ('+t+')')();return isFinite(v)?+v.toPrecision(12):null}catch(e){return null}
}
function press(k){
  if(k==='C')expr='';
  else if(k==='⌫')expr=expr.slice(0,-1);
  else if(k==='='){const v=calc(expr);if(v!==null){exprEl.textContent=expr+' =';resEl.textContent=v;expr=String(v);return}}
  else{
    if('+−×÷'.includes(k)&&(expr===''||'+−×÷'.includes(expr.slice(-1)))){if(expr==='')return;expr=expr.slice(0,-1)}
    expr+=k;
  }
  exprEl.textContent=expr;
  const v=calc(expr);resEl.textContent=expr===''?'0':(v!==null?v:resEl.textContent);
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
